<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta 
     name="viewport"
     content="width=device-width, initial-scale=1.0"
    >

    <title>ログイン</title>

    <link rel="stylesheet" href="./css/style.css">
    <script src="./js/login.js" defer></script>
</head>

<body>
 <main>
  <h1>ログイン</h1>

  <form id="loginForm" novalidate>
    <div>
      <label for="email">メールアドレス</label>

      <input
        type="email"
        id="email"
        name="email"
        autocomplete="email"
        required
      >
    </div>

    <div>
       <label for="password">パスワード</label>

       <input
         type="password"
         id="password"
         name="password"
         autocomplete="current-password"
         required
        >
    </div>

    <p id="errorMessage" role="alert"></p>
    <p id="successMessage" role="status"></p>

    <button type="submit">
     ログイン
    </button>

    <p>
      <a href="/register.html">
        会員登録はこちら
      </a>
    </p>
  </form>
 </main>
</body>
</html>
