<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>会員登録</title>

  <link rel="stylesheet" href="./css/style.css">
  <script src="./js/register.js" defer></script>
</head>

<body>
  <main>
    <h1>会員登録</h1>

    <form id="registerForm" novalidate>
      <div>
        <lavel for="username">ユーザー名</lavel>
        <input 
          type="text" 
          id="username" 
          name="username" 
          autocomplete="username" 
          required
        >
      </div>
      
      <div>
        <label for="email">メールアドレス</label>

        <input
          type="email"
          id="email"
          name="email"
          autocomplete="email"
          required
        >
      </div>

      <div>
        <label for="password">パスワード</label>

        <input
          type="password"
          id="password"
          name="password"
          autocomplete="new-password"
          required
        >
      </div>

      <div>
        <label for="passwordConfirm">
          パスワード確認
        </label>

        <input
          type="password"
          id="passwordConfirm"
          name="passwordConfirm"
          autocomplete="new-password"
          required
        >
      </div>

      <p id="errorMessage" role="alert"></p>
      <p id="successMessage" role="status"></p>

      <button type="submit">
        登録
      </button>
    
    <p>
      <a href="/login.html">
        ログイン画面へ
      </a>
    </p>
    </form>

  </main>
</body>
</html>
